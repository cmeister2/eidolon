name: Cleanup

on:
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          # Must match the tag families in tags.json
          packages: eidolon/gb,eidolon/us,eidolon/global
          # 4 weeks of weekly publishes
          keep-n-tagged: 4
