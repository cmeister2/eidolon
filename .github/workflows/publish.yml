name: Publish

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  read-tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: tags
        run: echo "tags=$(jq -c 'keys' tags.json)" >> "$GITHUB_OUTPUT"

  generate-configs:
    runs-on: ubuntu-latest
    needs: read-tags
    outputs:
      cache-key: ${{ steps.date.outputs.key }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Get cache key
        id: date
        run: echo "key=nginx-configs-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore config cache
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: configs/
          key: ${{ steps.date.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install eidolon
        run: pip install .
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Generate all configs
        run: |
          for tag in $(jq -r 'keys[]' tags.json); do
            mkdir -p "configs/${tag}"
            eidolon --tag "${tag}" --output "configs/${tag}/nginx.conf"
          done

  publish:
    runs-on: ubuntu-latest
    needs: [generate-configs, read-tags]
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.read-tags.outputs.tags) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Restore config cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: configs/
          key: ${{ needs.generate-configs.outputs.cache-key }}

      - run: cp configs/${{ matrix.tag }}/nginx.conf .

      - name: Get date stamp
        id: date
        run: echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Rolling tag in the main package (e.g. ghcr.io/cmeister2/eidolon:gb)
          # Date-stamped tag in a per-tag package (e.g. ghcr.io/cmeister2/eidolon/gb:20260518)
          # The split allows the cleanup workflow to use keep-n-tagged per package.
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.tag }}
            ghcr.io/${{ github.repository }}/${{ matrix.tag }}:${{ steps.date.outputs.stamp }}
