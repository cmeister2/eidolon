name: Publish

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  read-tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: tags
        run: echo "tags=$(jq -c 'keys' tags.json)" >> "$GITHUB_OUTPUT"

  fetch-csvs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/fetch-csvs
        with:
          user-agent-prefix: eidolon-publish

  generate-configs:
    runs-on: ubuntu-latest
    needs: [read-tags, fetch-csvs]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download CSVs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-dns-csvs
          path: csvs/
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install eidolon
        run: pip install .
      - name: Generate all configs
        run: |
          for tag in $(jq -r 'keys[]' tags.json); do
            mkdir -p "configs/${tag}"
            eidolon --file "csvs/${tag}.csv" --output "configs/${tag}/nginx.conf"
          done
      - name: Upload configs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nginx-configs
          path: configs/**/nginx.conf
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [generate-configs, read-tags]
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.read-tags.outputs.tags) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download configs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nginx-configs
          path: configs/

      - run: cp configs/${{ matrix.tag }}/nginx.conf .

      - name: Get date stamp
        id: date
        run: echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Rolling tag in the main package (e.g. ghcr.io/cmeister2/eidolon:gb)
          # Date-stamped tag in a per-tag package (e.g. ghcr.io/cmeister2/eidolon/gb:20260518)
          # The split allows the cleanup workflow to use keep-n-tagged per package.
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.tag }}
            ghcr.io/${{ github.repository }}/${{ matrix.tag }}:${{ steps.date.outputs.stamp }}
