name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  read-tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - id: tags
        run: echo "tags=$(jq -c 'keys' tags.json)" >> "$GITHUB_OUTPUT"

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov=eidolon --cov-report=term-missing

  fetch-csvs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/fetch-csvs
        with:
          user-agent-prefix: eidolon-ci

  generate-configs:
    runs-on: ubuntu-latest
    needs: [lint-and-test, read-tags, fetch-csvs]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download CSVs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-dns-csvs
          path: csvs/
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install eidolon
        run: pip install .
      - name: Generate all configs
        run: |
          for tag in $(jq -r 'keys[]' tags.json); do
            mkdir -p "configs/${tag}"
            eidolon --file "csvs/${tag}.csv" --output "configs/${tag}/nginx.conf"
          done
      - name: Upload configs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nginx-configs
          path: configs/**/nginx.conf
          if-no-files-found: error

  docker-build:
    runs-on: ubuntu-latest
    needs: [generate-configs, read-tags]
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.read-tags.outputs.tags) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download configs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nginx-configs
          path: configs/
      - run: cp configs/${{ matrix.tag }}/nginx.conf .
      - name: Build Docker image
        run: docker build -t eidolon:${{ matrix.tag }} .

  docker-integration:
    runs-on: ubuntu-latest
    needs: [lint-and-test, fetch-csvs]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download CSVs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-dns-csvs
          path: csvs/
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Docker integration tests
        env:
          EIDOLON_GLOBAL_CSV: csvs/global.csv
        run: pytest -m docker -v

  success:
    name: Success
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build, docker-integration]
    steps:
      - name: Success
        run: echo "CI completed successfully!"
