name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  read-tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: tags
        run: echo "tags=$(jq -c 'keys' tags.json)" >> "$GITHUB_OUTPUT"

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov=eidolon --cov-report=term-missing

  fetch-csvs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Fetch CSVs
        run: |
          set -euo pipefail
          mkdir -p csvs
          jq -r 'to_entries[] | [.key, .value] | @tsv' tags.json | while IFS=$'\t' read -r tag csv_path; do
            curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 30 \
              --user-agent "eidolon-ci/${GITHUB_SHA} (+https://github.com/${GITHUB_REPOSITORY})" \
              --output "csvs/${tag}.csv" \
              "https://public-dns.info/${csv_path}"
          done
          test -n "$(find csvs -name '*.csv' -print -quit)"
      - name: Upload CSVs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-dns-csvs
          path: csvs/*.csv
          if-no-files-found: error

  generate-configs:
    runs-on: ubuntu-latest
    needs: [lint-and-test, read-tags, fetch-csvs]
    outputs:
      cache-key: ${{ steps.date.outputs.key }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Get cache key
        id: date
        run: echo "key=nginx-configs-${{ hashFiles('tags.json') }}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore config cache
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: configs/
          key: ${{ steps.date.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Download CSVs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-dns-csvs
          path: csvs/
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install eidolon
        run: pip install .
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Generate all configs
        run: |
          for tag in $(jq -r 'keys[]' tags.json); do
            mkdir -p "configs/${tag}"
            eidolon --file "csvs/${tag}.csv" --output "configs/${tag}/nginx.conf"
          done

  docker-build:
    runs-on: ubuntu-latest
    needs: [generate-configs, read-tags]
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.read-tags.outputs.tags) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Restore config cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: configs/
          key: ${{ needs.generate-configs.outputs.cache-key }}
      - run: cp configs/${{ matrix.tag }}/nginx.conf .
      - name: Build Docker image
        run: docker build -t eidolon:${{ matrix.tag }} .

  docker-integration:
    runs-on: ubuntu-latest
    needs: [lint-and-test, fetch-csvs]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download CSVs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-dns-csvs
          path: csvs/
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Docker integration tests
        env:
          EIDOLON_GLOBAL_CSV: csvs/global.csv
        run: pytest -m docker -v

  success:
    name: Success
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build, docker-integration]
    steps:
      - name: Success
        run: echo "CI completed successfully!"
