name: Fetch public DNS CSVs
description: Restore or fetch public-dns.info CSVs, then upload them for this workflow run.

inputs:
  user-agent-prefix:
    description: Prefix for the public-dns.info User-Agent header.
    required: true

runs:
  using: composite
  steps:
    - name: Get CSV cache key
      id: date
      shell: bash
      run: |
        tags_hash=$(sha256sum tags.json | awk '{print $1}')
        echo "key=public-dns-csvs-${tags_hash}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
    - name: Restore CSV cache
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: csvs/
        key: ${{ steps.date.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      name: Fetch CSVs
      shell: bash
      env:
        USER_AGENT_PREFIX: ${{ inputs.user-agent-prefix }}
      run: |
        set -euo pipefail
        mkdir -p csvs
        jq -r 'to_entries[] | [.key, .value] | @tsv' tags.json | while IFS=$'\t' read -r tag csv_path; do
          curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 30 \
            --user-agent "${USER_AGENT_PREFIX}/${GITHUB_SHA} (+https://github.com/${GITHUB_REPOSITORY})" \
            --output "csvs/${tag}.csv" \
            "https://public-dns.info/${csv_path}"
        done
    - name: Check CSVs
      shell: bash
      run: test -n "$(find csvs -name '*.csv' -print -quit)"
    - name: Upload CSVs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: public-dns-csvs
        path: csvs/*.csv
        if-no-files-found: error